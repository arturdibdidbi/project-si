<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Editar objetivo</title>
</head>

<body>

    <h1>Editar objetivo</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Salvar alterações
        </button>

    </form>

    <a href="{% url 'objetivo' objetivo_id=objetivo.id %}">
        Cancelar
    </a>

</body>

</html>
