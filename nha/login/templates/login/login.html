 {% load static %}
<!DOCTYPE html>
<html lang="pt-br">

 <link rel="stylesheet" href="{%  static 'style.css' %}">
</head>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

    <label>

    </script>

        {% endfor %}
    {% endif %}
  
 <a href="{% url 'editlogin' %}">esqueci a senha</a>
 <a href="/cadastro">Não tem uma conta? Cadastre-se</a>

</body>
</html>
