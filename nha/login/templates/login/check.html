<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
 <link rel="stylesheet" href="{%  static 'style.css' %}">
</head>

<body>

    <h1>Recuperar Conta</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Entrar</button>
    </form>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}
  

</body>
 <a href="/login">Voltar ao login</a>
 <a href="/cadastro">Não tem uma conta? Cadastre-se</a>
</html>
